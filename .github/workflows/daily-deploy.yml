name: daily-deploy

on:
  schedule:
    # Nightly at 02:00 America/Denver (09:00 UTC)
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel rebuild
        run: curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" | tee /dev/stderr
