name: daily-deploy

on:
  schedule:
    # Twice daily at 02:00 and 14:00 America/Denver (09:00, 21:00 UTC)
    - cron: "0 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build site and refresh writing data from RSS
        run: npm run build

      - name: Commit writing data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/writing.json
          if git diff --cached --quiet; then
            echo "No new posts since last sync."
          else
            git commit -m "chore: sync writing data from RSS feed"
            git push
            echo "Pushed writing data update; Vercel will deploy."
          fi
