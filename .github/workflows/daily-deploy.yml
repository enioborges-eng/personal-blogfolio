name: daily-deploy

on:
  schedule:
    # Twice daily at 02:00 and 14:00 America/Denver (09:00, 21:00 UTC)
    - cron: "0 9,21 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel rebuild
        run: curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" | tee /dev/stderr
